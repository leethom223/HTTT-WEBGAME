<svg width="860" height="500" viewBox="0 0 860 500" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arrSeq" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrSeqDash" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>
  <text x="430" y="32" font-size="20" font-weight="bold" fill="#1e1b4b" text-anchor="middle">HÌNH 3.5: SƠ ĐỒ TUẦN TỰ (SEQUENCE) - ĐĂNG NHẬP HỆ THỐNG</text>
  
  <!-- Lifelines -->
  <!-- 1. User -->
  <rect x="30" y="60" width="120" height="40" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="90" y="85" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">User (Browser)</text>
  <line x1="90" y1="100" x2="90" y2="460" stroke="#94a3b8" stroke-dasharray="4"/>

  <!-- 2. React Client -->
  <rect x="200" y="60" width="130" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="265" y="85" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">React Client (SPA)</text>
  <line x1="265" y1="100" x2="265" y2="460" stroke="#94a3b8" stroke-dasharray="4"/>

  <!-- 3. AuthController -->
  <rect x="380" y="60" width="130" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="445" y="85" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">AuthController</text>
  <line x1="445" y1="100" x2="445" y2="460" stroke="#94a3b8" stroke-dasharray="4"/>

  <!-- 4. Sanctum Model -->
  <rect x="560" y="60" width="130" height="40" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="625" y="85" font-size="13" font-weight="bold" fill="#6b21a8" text-anchor="middle">Sanctum / Token</text>
  <line x1="625" y1="100" x2="625" y2="460" stroke="#94a3b8" stroke-dasharray="4"/>

  <!-- 5. MySQL Database -->
  <rect x="720" y="60" width="120" height="40" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="780" y="85" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">MySQL Database</text>
  <line x1="780" y1="100" x2="780" y2="460" stroke="#94a3b8" stroke-dasharray="4"/>

  <!-- Message 1 -->
  <line x1="90" y1="130" x2="265" y2="130" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrSeq)"/>
  <text x="177" y="122" font-size="11" fill="#1e3a8a" text-anchor="middle">1. Nhập Email &amp; Password</text>

  <!-- Message 2 -->
  <line x1="265" y1="170" x2="445" y2="170" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrSeq)"/>
  <text x="355" y="162" font-size="11" fill="#1e3a8a" text-anchor="middle">2. POST /api/login</text>

  <!-- Message 3 -->
  <line x1="445" y1="210" x2="780" y2="210" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrSeq)"/>
  <text x="612" y="202" font-size="11" fill="#1e3a8a" text-anchor="middle">3. SELECT * FROM users WHERE email = ...</text>

  <!-- Message 4 -->
  <line x1="780" y1="250" x2="445" y2="250" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrSeqDash)"/>
  <text x="612" y="242" font-size="11" fill="#166534" text-anchor="middle">4. Trả về User Record &amp; Password Hash</text>

  <!-- Message 5: Self check -->
  <path d="M 445 280 L 485 280 L 485 305 L 445 305" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="540" y="297" font-size="11" fill="#92400e">5. Hash::check()</text>

  <!-- Message 6 -->
  <line x1="445" y1="335" x2="625" y2="335" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrSeq)"/>
  <text x="535" y="327" font-size="11" fill="#6b21a8" text-anchor="middle">6. createToken('auth_token')</text>

  <!-- Message 7 -->
  <line x1="625" y1="370" x2="445" y2="370" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrSeqDash)"/>
  <text x="535" y="362" font-size="11" fill="#166534" text-anchor="middle">7. PlainTextToken String</text>

  <!-- Message 8 -->
  <line x1="445" y1="405" x2="265" y2="405" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrSeqDash)"/>
  <text x="355" y="397" font-size="11" fill="#166534" text-anchor="middle">8. HTTP 200 { token, user }</text>

  <!-- Message 9 -->
  <line x1="265" y1="440" x2="90" y2="440" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrSeqDash)"/>
  <text x="177" y="432" font-size="11" fill="#166534" text-anchor="middle">9. Lưu Token &amp; Render Header</text>
</svg>
