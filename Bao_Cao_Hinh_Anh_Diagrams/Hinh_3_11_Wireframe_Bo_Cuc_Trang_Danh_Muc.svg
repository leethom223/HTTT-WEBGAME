<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shWf11" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <text x="450" y="35" font-size="20" font-weight="bold" fill="#1e1b4b" text-anchor="middle">
    HÌNH 3.11: WIREFRAME BỐ CỤC TRANG THỂ LOẠI TRÒ CHƠI (/category/:slug)
  </text>

  <g transform="translate(40, 60)" filter="url(#shWf11)">
    <!-- Browser Window Container -->
    <rect width="820" height="500" rx="10" fill="#0f111a" stroke="#334155" stroke-width="2"/>
    
    <!-- Navbar Header -->
    <rect width="820" height="55" rx="10" fill="#181b26"/>
    <rect y="45" width="820" height="10" fill="#181b26"/>
    <text x="30" y="34" font-size="16" font-weight="bold" fill="#a855f7">🎮 GAMEX PORTAL</text>
    <rect x="250" y="12" width="280" height="30" rx="15" fill="#0f111a" stroke="#334155"/>
    <text x="270" y="32" font-size="12" fill="#94a3b8">🔍 Tìm kiếm trò chơi...</text>
    <rect x="620" y="14" width="80" height="28" rx="6" fill="#202433"/>
    <text x="660" y="32" font-size="11" fill="#fff" text-anchor="middle">❤️ Yêu thích</text>
    <rect x="715" y="14" width="80" height="28" rx="6" fill="#6366f1"/>
    <text x="755" y="32" font-size="11" fill="#fff" text-anchor="middle">👤 Đăng nhập</text>

    <!-- Category Banner Header -->
    <g transform="translate(20, 75)">
      <rect width="780" height="90" rx="10" fill="#1e1b4b" stroke="#3730a3"/>
      <rect x="20" y="15" width="60" height="60" rx="10" fill="#312e81"/>
      <text x="50" y="52" font-size="26" text-anchor="middle">🧩</text>
      <text x="95" y="38" font-size="11" fill="#a5b4fc">Trang chủ / Thể loại / Trí tuệ</text>
      <text x="95" y="65" font-size="20" font-weight="bold" fill="#ffffff">Game Trí Tuệ (Puzzle Games)</text>
      <text x="95" y="85" font-size="11" fill="#94a3b8">Tổng hợp các tựa game giải đố, rèn luyện tư duy logic trực tuyến hay nhất.</text>
    </g>

    <!-- Filter & Sub-Search Bar -->
    <g transform="translate(20, 180)">
      <text x="0" y="20" font-size="14" font-weight="bold" fill="#fff">Danh sách (12 trò chơi)</text>
      <rect x="420" y="0" width="190" height="28" rx="6" fill="#181b26" stroke="#334155"/>
      <text x="435" y="18" font-size="11" fill="#94a3b8">🔍 Lọc trong thể loại...</text>
      
      <rect x="625" y="0" width="155" height="28" rx="6" fill="#181b26" stroke="#334155"/>
      <text x="635" y="18" font-size="11" fill="#fff">Sắp xếp: Chơi nhiều ▼</text>
    </g>

    <!-- Grid of Games in Category -->
    <g transform="translate(20, 225)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="135" rx="8" fill="#202433" stroke="#334155"/>
        <rect width="180" height="80" rx="8" fill="#0f172a"/>
        <text x="90" y="48" font-size="11" fill="#64748b" text-anchor="middle">[Ảnh 2048 Classic]</text>
        <text x="10" y="102" font-size="12" font-weight="bold" fill="#fff">2048 Puzzle</text>
        <text x="10" y="122" font-size="10" fill="#f59e0b">★ 4.9 • 124k lượt</text>
      </g>
      <!-- Card 2 -->
      <g transform="translate(200, 0)">
        <rect width="180" height="135" rx="8" fill="#202433" stroke="#334155"/>
        <rect width="180" height="80" rx="8" fill="#0f172a"/>
        <text x="90" y="48" font-size="11" fill="#64748b" text-anchor="middle">[Ảnh Hextris 360]</text>
        <text x="10" y="102" font-size="12" font-weight="bold" fill="#fff">Hextris Arcade</text>
        <text x="10" y="122" font-size="10" fill="#f59e0b">★ 4.8 • 98k lượt</text>
      </g>
      <!-- Card 3 -->
      <g transform="translate(400, 0)">
        <rect width="180" height="135" rx="8" fill="#202433" stroke="#334155"/>
        <rect width="180" height="80" rx="8" fill="#0f172a"/>
        <text x="90" y="48" font-size="11" fill="#64748b" text-anchor="middle">[Ảnh Sudoku Master]</text>
        <text x="10" y="102" font-size="12" font-weight="bold" fill="#fff">Sudoku Brain</text>
        <text x="10" y="122" font-size="10" fill="#f59e0b">★ 4.8 • 51k lượt</text>
      </g>
      <!-- Card 4 -->
      <g transform="translate(600, 0)">
        <rect width="180" height="135" rx="8" fill="#202433" stroke="#334155"/>
        <rect width="180" height="80" rx="8" fill="#0f172a"/>
        <text x="90" y="48" font-size="11" fill="#64748b" text-anchor="middle">[Ảnh Chess Logic]</text>
        <text x="10" y="102" font-size="12" font-weight="bold" fill="#fff">Chess Master</text>
        <text x="10" y="122" font-size="10" fill="#f59e0b">★ 4.7 • 42k lượt</text>
      </g>
    </g>

    <!-- Pagination Bar -->
    <g transform="translate(320, 380)">
      <rect x="0" width="35" height="30" rx="4" fill="#202433" stroke="#334155"/>
      <text x="17" y="20" font-size="11" fill="#fff" text-anchor="middle">&lt;</text>
      
      <rect x="45" width="35" height="30" rx="4" fill="#6366f1"/>
      <text x="62" y="20" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">1</text>

      <rect x="90" width="35" height="30" rx="4" fill="#202433" stroke="#334155"/>
      <text x="107" y="20" font-size="11" fill="#94a3b8" text-anchor="middle">2</text>

      <rect x="135" width="35" height="30" rx="4" fill="#202433" stroke="#334155"/>
      <text x="152" y="20" font-size="11" fill="#fff" text-anchor="middle">&gt;</text>
    </g>

    <!-- Footer -->
    <rect y="455" width="820" height="45" rx="10" fill="#181b26"/>
    <text x="410" y="482" font-size="11" fill="#94a3b8" text-anchor="middle">
      Đồ Án Tốt Nghiệp Hệ Thống Thông Tin • Trang Thể Loại Category
    </text>
  </g>
</svg>
