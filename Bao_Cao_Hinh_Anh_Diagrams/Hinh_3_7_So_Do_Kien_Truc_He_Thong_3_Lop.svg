<svg width="880" height="520" viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arrTier" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <filter id="shTier" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <text x="440" y="38" font-size="22" font-weight="bold" fill="#1e1b4b" text-anchor="middle">
    HÌNH 3.7: SƠ ĐỒ KIẾN TRÚC HỆ THỐNG 3 LỚP (3-TIER ARCHITECTURE)
  </text>

  <!-- LAYER 1: PRESENTATION LAYER -->
  <g transform="translate(60, 75)" filter="url(#shTier)">
    <rect width="760" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect width="760" height="32" rx="10" fill="#3b82f6"/>
    <rect y="24" width="760" height="8" fill="#3b82f6"/>
    <text x="380" y="22" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      TẦNG TRÌNH DIỄN (PRESENTATION LAYER) — REACT 19 SPA
    </text>
    <g transform="translate(20, 45)">
      <rect x="0" y="5" width="165" height="48" rx="6" fill="#ffffff" stroke="#93c5fd"/>
      <text x="82" y="33" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Trang chủ &amp; Lọc game</text>
      
      <rect x="180" y="5" width="165" height="48" rx="6" fill="#ffffff" stroke="#93c5fd"/>
      <text x="262" y="33" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Khung chơi WebGL</text>

      <rect x="360" y="5" width="165" height="48" rx="6" fill="#ffffff" stroke="#93c5fd"/>
      <text x="442" y="33" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Tương tác: Tim/Sao/Cmt</text>

      <rect x="540" y="5" width="175" height="48" rx="6" fill="#ffffff" stroke="#93c5fd"/>
      <text x="627" y="33" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Bảng điều khiển Admin</text>
    </g>
  </g>

  <!-- Connectors Layer 1 to 2 -->
  <line x1="360" y1="185" x2="360" y2="225" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrTier)"/>
  <text x="310" y="210" font-size="11" font-weight="bold" fill="#3b82f6">JSON Request</text>

  <line x1="520" y1="225" x2="520" y2="185" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrTier)"/>
  <text x="565" y="210" font-size="11" font-weight="bold" fill="#3b82f6">JSON Response</text>

  <!-- LAYER 2: BUSINESS LOGIC LAYER -->
  <g transform="translate(60, 225)" filter="url(#shTier)">
    <rect width="760" height="115" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <rect width="760" height="32" rx="10" fill="#a855f7"/>
    <rect y="24" width="760" height="8" fill="#a855f7"/>
    <text x="380" y="22" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      TẦNG NGHIỆP VỤ &amp; DỊCH VỤ (BUSINESS LOGIC LAYER) — LARAVEL 11 REST API
    </text>
    <g transform="translate(20, 45)">
      <rect x="0" y="5" width="135" height="52" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
      <text x="67" y="27" font-size="11" font-weight="bold" fill="#581c87" text-anchor="middle">Routing &amp; CORS</text>
      <text x="67" y="44" font-size="10" fill="#64748b" text-anchor="middle">routes/api.php</text>

      <rect x="145" y="5" width="135" height="52" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
      <text x="212" y="27" font-size="11" font-weight="bold" fill="#581c87" text-anchor="middle">Sanctum Auth</text>
      <text x="212" y="44" font-size="10" fill="#64748b" text-anchor="middle">Bearer Token</text>

      <rect x="290" y="5" width="135" height="52" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
      <text x="357" y="27" font-size="11" font-weight="bold" fill="#581c87" text-anchor="middle">Game Controller</text>
      <text x="357" y="44" font-size="10" fill="#64748b" text-anchor="middle">Filter/Search/CRUD</text>

      <rect x="435" y="5" width="135" height="52" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
      <text x="502" y="27" font-size="11" font-weight="bold" fill="#581c87" text-anchor="middle">Interaction Ctrl</text>
      <text x="502" y="44" font-size="10" fill="#64748b" text-anchor="middle">Cmt, Rate, Fav, Hist</text>

      <rect x="580" y="5" width="135" height="52" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
      <text x="647" y="27" font-size="11" font-weight="bold" fill="#581c87" text-anchor="middle">IsAdmin Guard</text>
      <text x="647" y="44" font-size="10" fill="#64748b" text-anchor="middle">Phân quyền 403</text>
    </g>
  </g>

  <!-- Connectors Layer 2 to 3 -->
  <line x1="360" y1="340" x2="360" y2="380" stroke="#16a34a" stroke-width="2" marker-end="url(#arrTier)"/>
  <text x="305" y="365" font-size="11" font-weight="bold" fill="#16a34a">Eloquent / SQL</text>

  <line x1="520" y1="380" x2="520" y2="340" stroke="#16a34a" stroke-width="2" marker-end="url(#arrTier)"/>
  <text x="560" y="365" font-size="11" font-weight="bold" fill="#16a34a">Data Records</text>

  <!-- LAYER 3: DATA ACCESS LAYER -->
  <g transform="translate(60, 380)" filter="url(#shTier)">
    <rect width="760" height="110" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <rect width="760" height="32" rx="10" fill="#22c55e"/>
    <rect y="24" width="760" height="8" fill="#22c55e"/>
    <text x="380" y="22" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      TẦNG DỮ LIỆU (DATA ACCESS LAYER) — MYSQL 8.X &amp; FILE STORAGE
    </text>
    <g transform="translate(20, 45)">
      <rect x="0" y="5" width="165" height="48" rx="6" fill="#ffffff" stroke="#86efac"/>
      <text x="82" y="33" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">users, games, categories</text>
      
      <rect x="180" y="5" width="165" height="48" rx="6" fill="#ffffff" stroke="#86efac"/>
      <text x="262" y="33" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">game_category (pivot)</text>

      <rect x="360" y="5" width="165" height="48" rx="6" fill="#ffffff" stroke="#86efac"/>
      <text x="442" y="33" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">comments, ratings, favs</text>

      <rect x="540" y="5" width="175" height="48" rx="6" fill="#ffffff" stroke="#86efac"/>
      <text x="627" y="33" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Public Storage / Images</text>
    </g>
  </g>
</svg>
