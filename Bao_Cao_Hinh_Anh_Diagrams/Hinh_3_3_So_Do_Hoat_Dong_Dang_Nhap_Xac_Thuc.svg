<svg width="600" height="520" viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arrAct" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <filter id="shAct" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <text x="300" y="30" font-size="18" font-weight="bold" fill="#1e1b4b" text-anchor="middle">HÌNH 3.3: SƠ ĐỒ HOẠT ĐỘNG - ĐĂNG NHẬP HỆ THỐNG</text>
  <!-- Start -->
  <circle cx="300" cy="65" r="14" fill="#0f172a"/>
  <!-- Action 1 -->
  <rect x="180" y="110" width="240" height="40" rx="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shAct)"/>
  <text x="300" y="135" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Nhập Email &amp; Password</text>
  <!-- Action 2 -->
  <rect x="180" y="180" width="240" height="40" rx="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shAct)"/>
  <text x="300" y="205" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Gửi POST /api/login</text>
  <!-- Decision -->
  <polygon points="300,250 360,285 300,320 240,285" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shAct)"/>
  <text x="300" y="289" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">Khớp CSDL?</text>
  <!-- Error Action -->
  <rect x="440" y="265" width="130" height="40" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="505" y="290" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">Báo lỗi 401</text>
  <!-- Success Action -->
  <rect x="180" y="355" width="240" height="40" rx="20" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" filter="url(#shAct)"/>
  <text x="300" y="380" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">Tạo Sanctum Token &amp; Lưu Client</text>
  <!-- UI Update -->
  <rect x="180" y="425" width="240" height="40" rx="20" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" filter="url(#shAct)"/>
  <text x="300" y="450" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">Cập nhật Header UI (Logged In)</text>
  <!-- End -->
  <circle cx="300" cy="495" r="14" fill="none" stroke="#0f172a" stroke-width="2"/>
  <circle cx="300" cy="495" r="8" fill="#0f172a"/>
  <!-- Connectors -->
  <line x1="300" y1="79" x2="300" y2="110" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrAct)"/>
  <line x1="300" y1="150" x2="300" y2="180" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrAct)"/>
  <line x1="300" y1="220" x2="300" y2="250" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrAct)"/>
  <line x1="360" y1="285" x2="440" y2="285" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrAct)"/>
  <text x="395" y="278" font-size="10" fill="#ef4444">[Không]</text>
  <line x1="505" y1="265" x2="505" y2="130" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="505" y1="130" x2="420" y2="130" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrAct)"/>
  <line x1="300" y1="320" x2="300" y2="355" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrAct)"/>
  <text x="310" y="340" font-size="10" fill="#22c55e">[Đúng]</text>
  <line x1="300" y1="395" x2="300" y2="425" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrAct)"/>
  <line x1="300" y1="465" x2="300" y2="481" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrAct)"/>
</svg>
