<svg width="860" height="500" viewBox="0 0 860 500" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arrSeq2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrSeqDash2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>
  <text x="430" y="32" font-size="20" font-weight="bold" fill="#1e1b4b" text-anchor="middle">HÌNH 3.6: SƠ ĐỒ TUẦN TỰ - ADMIN THÊM MỚI GAME</text>
  
  <!-- Lifelines -->
  <rect x="30" y="60" width="120" height="40" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="90" y="85" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">Admin CMS</text>
  <line x1="90" y1="100" x2="90" y2="460" stroke="#94a3b8" stroke-dasharray="4"/>

  <rect x="200" y="60" width="130" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="265" y="85" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">GameForm (UI)</text>
  <line x1="265" y1="100" x2="265" y2="460" stroke="#94a3b8" stroke-dasharray="4"/>

  <rect x="380" y="60" width="130" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="445" y="85" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">GameController</text>
  <line x1="445" y1="100" x2="445" y2="460" stroke="#94a3b8" stroke-dasharray="4"/>

  <rect x="560" y="60" width="130" height="40" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="625" y="85" font-size="13" font-weight="bold" fill="#6b21a8" text-anchor="middle">Storage / Disk</text>
  <line x1="625" y1="100" x2="625" y2="460" stroke="#94a3b8" stroke-dasharray="4"/>

  <rect x="720" y="60" width="120" height="40" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="780" y="85" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">MySQL Database</text>
  <line x1="780" y1="100" x2="780" y2="460" stroke="#94a3b8" stroke-dasharray="4"/>

  <!-- Messages -->
  <line x1="90" y1="130" x2="265" y2="130" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrSeq2)"/>
  <text x="177" y="122" font-size="11" fill="#991b1b" text-anchor="middle">1. Điền Form &amp; Chọn Thumbnail</text>

  <line x1="265" y1="170" x2="445" y2="170" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrSeq2)"/>
  <text x="355" y="162" font-size="11" fill="#991b1b" text-anchor="middle">2. POST /api/admin/games (multipart)</text>

  <line x1="445" y1="210" x2="625" y2="210" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrSeq2)"/>
  <text x="535" y="202" font-size="11" fill="#6b21a8" text-anchor="middle">3. Upload thumbnail vào public disk</text>

  <line x1="625" y1="250" x2="445" y2="250" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrSeqDash2)"/>
  <text x="535" y="242" font-size="11" fill="#166534" text-anchor="middle">4. Trả về public file path</text>

  <line x1="445" y1="290" x2="780" y2="290" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrSeq2)"/>
  <text x="612" y="282" font-size="11" fill="#1e3a8a" text-anchor="middle">5. INSERT INTO games (...) VALUES (...)</text>

  <line x1="445" y1="335" x2="780" y2="335" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrSeq2)"/>
  <text x="612" y="327" font-size="11" fill="#1e3a8a" text-anchor="middle">6. INSERT INTO game_category (game_id, category_id)</text>

  <line x1="780" y1="375" x2="445" y2="375" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrSeqDash2)"/>
  <text x="612" y="367" font-size="11" fill="#166534" text-anchor="middle">7. Database OK (Game ID created)</text>

  <line x1="445" y1="410" x2="265" y2="410" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrSeqDash2)"/>
  <text x="355" y="402" font-size="11" fill="#166534" text-anchor="middle">8. HTTP 201 Created (Game JSON)</text>

  <line x1="265" y1="445" x2="90" y2="445" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrSeqDash2)"/>
  <text x="177" y="437" font-size="11" fill="#166534" text-anchor="middle">9. Báo thành công &amp; Refresh List</text>
</svg>
