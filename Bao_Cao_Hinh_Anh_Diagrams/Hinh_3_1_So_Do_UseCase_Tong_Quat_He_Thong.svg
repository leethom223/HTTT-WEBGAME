<svg width="900" height="650" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <text x="450" y="35" font-size="22" font-weight="bold" fill="#1e1b4b" text-anchor="middle">HÌNH 3.1: SƠ ĐỒ USECASE TỔNG QUÁT HỆ THỐNG</text>
  <rect x="230" y="60" width="440" height="560" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6"/>
  <text x="450" y="90" font-size="16" font-weight="bold" fill="#475569" text-anchor="middle">CỔNG GAME TRỰC TUYẾN</text>
  <g filter="url(#shadow3)">
    <ellipse cx="450" cy="130" rx="110" ry="25" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="450" y="135" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">UC01: Xem Danh sách Game</text>
    <ellipse cx="450" cy="190" rx="110" ry="25" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="450" y="195" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">UC02: Tìm kiếm Game</text>
    <ellipse cx="450" cy="250" rx="110" ry="25" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="450" y="255" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">UC03: Chơi Game Trực Tuyến</text>
    <ellipse cx="450" cy="310" rx="110" ry="25" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="450" y="315" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">UC04: Đăng ký / Đăng nhập</text>
    <ellipse cx="450" cy="370" rx="110" ry="25" fill="#fdf4ff" stroke="#d946ef" stroke-width="1.5"/>
    <text x="450" y="375" font-size="13" font-weight="bold" fill="#a21caf" text-anchor="middle">UC05: Yêu thích Game</text>
    <ellipse cx="450" cy="430" rx="110" ry="25" fill="#fdf4ff" stroke="#d946ef" stroke-width="1.5"/>
    <text x="450" y="435" font-size="13" font-weight="bold" fill="#a21caf" text-anchor="middle">UC06: Bình luận &amp; Đánh giá</text>
    <ellipse cx="450" cy="490" rx="110" ry="25" fill="#fdf4ff" stroke="#d946ef" stroke-width="1.5"/>
    <text x="450" y="495" font-size="13" font-weight="bold" fill="#a21caf" text-anchor="middle">UC07: Xem Lịch sử Đã Chơi</text>
    <ellipse cx="450" cy="550" rx="110" ry="25" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="450" y="555" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">UC08: Quản trị CRUD Game</text>
  </g>
  <!-- Guest Actor -->
  <g transform="translate(60, 160)">
    <circle cx="40" cy="20" r="16" fill="#3b82f6"/>
    <line x1="40" y1="36" x2="40" y2="80" stroke="#3b82f6" stroke-width="3"/>
    <line x1="40" y1="50" x2="10" y2="65" stroke="#3b82f6" stroke-width="3"/>
    <line x1="40" y1="50" x2="70" y2="65" stroke="#3b82f6" stroke-width="3"/>
    <line x1="40" y1="80" x2="15" y2="120" stroke="#3b82f6" stroke-width="3"/>
    <line x1="40" y1="80" x2="65" y2="120" stroke="#3b82f6" stroke-width="3"/>
    <text x="40" y="145" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Khách (Guest)</text>
  </g>
  <!-- Member Actor -->
  <g transform="translate(60, 400)">
    <circle cx="40" cy="20" r="16" fill="#a855f7"/>
    <line x1="40" y1="36" x2="40" y2="80" stroke="#a855f7" stroke-width="3"/>
    <line x1="40" y1="50" x2="10" y2="65" stroke="#a855f7" stroke-width="3"/>
    <line x1="40" y1="50" x2="70" y2="65" stroke="#a855f7" stroke-width="3"/>
    <line x1="40" y1="80" x2="15" y2="120" stroke="#a855f7" stroke-width="3"/>
    <line x1="40" y1="80" x2="65" y2="120" stroke="#a855f7" stroke-width="3"/>
    <text x="40" y="145" font-size="14" font-weight="bold" fill="#581c87" text-anchor="middle">Thành viên</text>
  </g>
  <path d="M 100 400 L 100 300" stroke="#64748b" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="100,290 94,302 106,302" fill="#64748b"/>
  <!-- Admin Actor -->
  <g transform="translate(760, 320)">
    <circle cx="40" cy="20" r="16" fill="#ef4444"/>
    <line x1="40" y1="36" x2="40" y2="80" stroke="#ef4444" stroke-width="3"/>
    <line x1="40" y1="50" x2="10" y2="65" stroke="#ef4444" stroke-width="3"/>
    <line x1="40" y1="50" x2="70" y2="65" stroke="#ef4444" stroke-width="3"/>
    <line x1="40" y1="80" x2="15" y2="120" stroke="#ef4444" stroke-width="3"/>
    <line x1="40" y1="80" x2="65" y2="120" stroke="#ef4444" stroke-width="3"/>
    <text x="40" y="145" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">Admin CMS</text>
  </g>
  <line x1="120" y1="210" x2="340" y2="130" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="120" y1="210" x2="340" y2="190" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="120" y1="210" x2="340" y2="250" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="120" y1="210" x2="340" y2="310" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="120" y1="450" x2="340" y2="370" stroke="#d946ef" stroke-width="1.5"/>
  <line x1="120" y1="450" x2="340" y2="430" stroke="#d946ef" stroke-width="1.5"/>
  <line x1="120" y1="450" x2="340" y2="490" stroke="#d946ef" stroke-width="1.5"/>
  <line x1="760" y1="370" x2="560" y2="550" stroke="#ef4444" stroke-width="1.5"/>
</svg>
