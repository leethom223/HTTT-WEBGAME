<svg width="850" height="420" viewBox="0 0 850 420" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4338ca"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <text x="425" y="40" font-size="22" font-weight="bold" fill="#1e1b4b" text-anchor="middle">HÌNH 2.1: SƠ ĐỒ KIẾN TRÚC CLIENT - API - DATABASE</text>
  <!-- Client Box -->
  <g transform="translate(40, 90)" filter="url(#shadow)">
    <rect width="210" height="260" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect width="210" height="45" rx="12" fill="#3b82f6"/>
    <rect y="35" width="210" height="10" fill="#3b82f6"/>
    <text x="105" y="28" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">CLIENT (TRÌNH DUYỆT)</text>
    <text x="105" y="75" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">React.js SPA</text>
    <text x="20" y="115" font-size="13" fill="#334155">• Giao diện người dùng</text>
    <text x="20" y="145" font-size="13" fill="#334155">• Single Page Routing</text>
    <text x="20" y="175" font-size="13" fill="#334155">• Axios HTTP Client</text>
    <text x="20" y="205" font-size="13" fill="#334155">• Khung chơi Game WebGL</text>
    <text x="20" y="235" font-size="13" fill="#334155">• Quản lý State/Token</text>
  </g>
  <!-- Server Box -->
  <g transform="translate(320, 90)" filter="url(#shadow)">
    <rect width="210" height="260" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <rect width="210" height="45" rx="12" fill="#a855f7"/>
    <rect y="35" width="210" height="10" fill="#a855f7"/>
    <text x="105" y="28" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">SERVER (MÁY CHỦ)</text>
    <text x="105" y="75" font-size="14" font-weight="bold" fill="#581c87" text-anchor="middle">Laravel 11 REST API</text>
    <text x="20" y="115" font-size="13" fill="#334155">• Định tuyến (Routing)</text>
    <text x="20" y="145" font-size="13" fill="#334155">• Xác thực Sanctum Token</text>
    <text x="20" y="175" font-size="13" fill="#334155">• Controller xử lý logic</text>
    <text x="20" y="205" font-size="13" fill="#334155">• Upload tệp &amp; hình ảnh</text>
    <text x="20" y="235" font-size="13" fill="#334155">• Eloquent ORM mapping</text>
  </g>
  <!-- Database Box -->
  <g transform="translate(600, 90)" filter="url(#shadow)">
    <rect width="210" height="260" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <rect width="210" height="45" rx="12" fill="#22c55e"/>
    <rect y="35" width="210" height="10" fill="#22c55e"/>
    <text x="105" y="28" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">DATABASE (CSDL)</text>
    <text x="105" y="75" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">MySQL 8.x RDBMS</text>
    <text x="20" y="115" font-size="13" fill="#334155">• Bảng users, games</text>
    <text x="20" y="145" font-size="13" fill="#334155">• Bảng categories</text>
    <text x="20" y="175" font-size="13" fill="#334155">• Bảng comments, ratings</text>
    <text x="20" y="205" font-size="13" fill="#334155">• Bảng favorites, history</text>
    <text x="20" y="235" font-size="13" fill="#334155">• Khóa ngoại &amp; Ràng buộc</text>
  </g>
  <!-- Connections -->
  <path d="M 255 180 L 315 180" stroke="#4338ca" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="285" y="165" font-size="11" font-weight="bold" fill="#4338ca" text-anchor="middle">HTTP Request</text>
  <path d="M 315 250 L 255 250" stroke="#4338ca" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="285" y="240" font-size="11" font-weight="bold" fill="#4338ca" text-anchor="middle">JSON Response</text>
  <path d="M 535 180 L 595 180" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="565" y="165" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">SQL Query</text>
  <path d="M 595 250 L 535 250" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="565" y="240" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">Result Set</text>
</svg>
