<svg width="860" height="580" viewBox="0 0 860 580" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shAdm" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <text x="430" y="35" font-size="20" font-weight="bold" fill="#1e1b4b" text-anchor="middle">
    HÌNH 3.2: SƠ ĐỒ USECASE PHÂN HỆ QUẢN TRỊ VIÊN (ADMIN CMS)
  </text>

  <!-- System Boundary -->
  <rect x="250" y="60" width="560" height="490" rx="14" fill="#faf5ff" stroke="#a855f7" stroke-width="2" stroke-dasharray="6"/>
  <text x="530" y="90" font-size="15" font-weight="bold" fill="#6b21a8" text-anchor="middle">
    PHÂN HỆ QUẢN TRỊ GAMEX CMS
  </text>

  <!-- Admin Actor -->
  <g transform="translate(60, 220)">
    <circle cx="40" cy="20" r="18" fill="#ef4444"/>
    <line x1="40" y1="38" x2="40" y2="85" stroke="#ef4444" stroke-width="3.5"/>
    <line x1="40" y1="52" x2="10" y2="70" stroke="#ef4444" stroke-width="3.5"/>
    <line x1="40" y1="52" x2="70" y2="70" stroke="#ef4444" stroke-width="3.5"/>
    <line x1="40" y1="85" x2="15" y2="130" stroke="#ef4444" stroke-width="3.5"/>
    <line x1="40" y1="85" x2="65" y2="130" stroke="#ef4444" stroke-width="3.5"/>
    <text x="40" y="155" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">Quản Trị Viên</text>
    <text x="40" y="172" font-size="11" fill="#64748b" text-anchor="middle">(Admin Role)</text>
  </g>

  <!-- Use Cases -->
  <g filter="url(#shAdm)">
    <!-- UC 1 -->
    <ellipse cx="430" cy="140" rx="140" ry="26" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="430" y="145" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">
      UC10: Quản lý Trò chơi (CRUD)
    </text>

    <!-- Sub Use Cases for Game -->
    <ellipse cx="690" cy="115" rx="90" ry="20" fill="#ffffff" stroke="#f87171" stroke-width="1.2"/>
    <text x="690" y="120" font-size="11" fill="#7f1d1d" text-anchor="middle">Thêm game &amp; Upload ảnh</text>

    <ellipse cx="690" cy="165" rx="90" ry="20" fill="#ffffff" stroke="#f87171" stroke-width="1.2"/>
    <text x="690" y="170" font-size="11" fill="#7f1d1d" text-anchor="middle">Sửa &amp; Xóa trò chơi</text>

    <!-- UC 2 -->
    <ellipse cx="430" cy="240" rx="140" ry="26" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="430" y="245" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">
      UC11: Quản lý Thể loại (CRUD)
    </text>

    <!-- Sub Use Cases for Category -->
    <ellipse cx="690" cy="240" rx="90" ry="20" fill="#ffffff" stroke="#f87171" stroke-width="1.2"/>
    <text x="690" y="245" font-size="11" fill="#7f1d1d" text-anchor="middle">Thêm/Sửa/Xóa Danh mục</text>

    <!-- UC 3 -->
    <ellipse cx="430" cy="340" rx="140" ry="26" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="430" y="345" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">
      UC12: Quản lý &amp; Duyệt Bình luận
    </text>

    <!-- UC 4 -->
    <ellipse cx="430" cy="440" rx="140" ry="26" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="430" y="445" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">
      UC13: Xem Báo cáo &amp; Thống kê lượt chơi
    </text>
  </g>

  <!-- Connectors from Actor to Main Use Cases -->
  <line x1="140" y1="270" x2="290" y2="140" stroke="#ef4444" stroke-width="1.8"/>
  <line x1="140" y1="270" x2="290" y2="240" stroke="#ef4444" stroke-width="1.8"/>
  <line x1="140" y1="270" x2="290" y2="340" stroke="#ef4444" stroke-width="1.8"/>
  <line x1="140" y1="270" x2="290" y2="440" stroke="#ef4444" stroke-width="1.8"/>

  <!-- Include / Extend connectors -->
  <path d="M 570 130 L 600 120" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4"/>
  <text x="590" y="115" font-size="9" fill="#64748b">&lt;&lt;include&gt;&gt;</text>

  <path d="M 570 150 L 600 160" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4"/>
  <text x="590" y="172" font-size="9" fill="#64748b">&lt;&lt;include&gt;&gt;</text>

  <path d="M 570 240 L 600 240" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4"/>
  <text x="585" y="234" font-size="9" fill="#64748b">&lt;&lt;include&gt;&gt;</text>
</svg>
