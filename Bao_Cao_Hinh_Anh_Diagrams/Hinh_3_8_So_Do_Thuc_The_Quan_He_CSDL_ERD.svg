<svg width="960" height="720" viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Consolas', 'Segoe UI', monospace;">
  <defs>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <text x="480" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e1b4b" text-anchor="middle">HÌNH 3.8: SƠ ĐỒ THỰC THỂ QUAN HỆ (ERD) CSDL GAME PORTAL</text>
  <!-- USERS -->
  <g transform="translate(40, 80)" filter="url(#shadow4)">
    <rect width="220" height="210" fill="#f8fafc" stroke="#3b82f6" stroke-width="2" rx="8"/>
    <rect width="220" height="35" fill="#3b82f6" rx="8"/>
    <rect y="25" width="220" height="10" fill="#3b82f6"/>
    <text x="110" y="24" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">USERS</text>
    <text x="15" y="60" font-size="12" fill="#0f172a"><tspan fill="#ef4444" font-weight="bold">PK </tspan>id : BIGINT</text>
    <text x="15" y="85" font-size="12" fill="#0f172a">   username : VARCHAR(50)</text>
    <text x="15" y="110" font-size="12" fill="#0f172a">   email : VARCHAR(100)</text>
    <text x="15" y="135" font-size="12" fill="#0f172a">   password : VARCHAR(255)</text>
    <text x="15" y="160" font-size="12" fill="#0f172a">   avatar : VARCHAR(255)</text>
    <text x="15" y="185" font-size="12" fill="#0f172a">   role : ENUM('mem','adm')</text>
  </g>
  <!-- GAMES -->
  <g transform="translate(700, 80)" filter="url(#shadow4)">
    <rect width="220" height="280" fill="#f8fafc" stroke="#6366f1" stroke-width="2" rx="8"/>
    <rect width="220" height="35" fill="#6366f1" rx="8"/>
    <rect y="25" width="220" height="10" fill="#6366f1"/>
    <text x="110" y="24" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">GAMES</text>
    <text x="15" y="60" font-size="12" fill="#0f172a"><tspan fill="#ef4444" font-weight="bold">PK </tspan>id : BIGINT</text>
    <text x="15" y="85" font-size="12" fill="#0f172a">   title : VARCHAR(200)</text>
    <text x="15" y="110" font-size="12" fill="#0f172a">   slug : VARCHAR(200)</text>
    <text x="15" y="135" font-size="12" fill="#0f172a">   thumbnail : VARCHAR</text>
    <text x="15" y="160" font-size="12" fill="#0f172a">   play_url : TEXT</text>
    <text x="15" y="185" font-size="12" fill="#0f172a">   description : TEXT</text>
    <text x="15" y="210" font-size="12" fill="#0f172a">   play_count : BIGINT</text>
    <text x="15" y="235" font-size="12" fill="#0f172a">   rating_avg : DECIMAL</text>
    <text x="15" y="260" font-size="12" fill="#0f172a">   badge : ENUM('HOT'...)</text>
  </g>
  <!-- FAVORITES -->
  <g transform="translate(370, 80)" filter="url(#shadow4)">
    <rect width="220" height="110" fill="#fdf2f8" stroke="#ec4899" stroke-width="2" rx="8"/>
    <rect width="220" height="30" fill="#ec4899" rx="8"/>
    <rect y="20" width="220" height="10" fill="#ec4899"/>
    <text x="110" y="20" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">FAVORITES</text>
    <text x="15" y="50" font-size="11" fill="#0f172a"><tspan fill="#ef4444" font-weight="bold">PK </tspan>id : BIGINT</text>
    <text x="15" y="70" font-size="11" fill="#0f172a"><tspan fill="#3b82f6" font-weight="bold">FK </tspan>user_id : BIGINT</text>
    <text x="15" y="90" font-size="11" fill="#0f172a"><tspan fill="#6366f1" font-weight="bold">FK </tspan>game_id : BIGINT</text>
  </g>
  <!-- PLAY_HISTORY -->
  <g transform="translate(370, 230)" filter="url(#shadow4)">
    <rect width="220" height="120" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" rx="8"/>
    <rect width="220" height="30" fill="#8b5cf6" rx="8"/>
    <rect y="20" width="220" height="10" fill="#8b5cf6"/>
    <text x="110" y="20" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">PLAY_HISTORY</text>
    <text x="15" y="50" font-size="11" fill="#0f172a"><tspan fill="#ef4444" font-weight="bold">PK </tspan>id : BIGINT</text>
    <text x="15" y="70" font-size="11" fill="#0f172a"><tspan fill="#3b82f6" font-weight="bold">FK </tspan>user_id : BIGINT</text>
    <text x="15" y="90" font-size="11" fill="#0f172a"><tspan fill="#6366f1" font-weight="bold">FK </tspan>game_id : BIGINT</text>
    <text x="15" y="110" font-size="11" fill="#0f172a">   played_at : TIMESTAMP</text>
  </g>
  <!-- COMMENTS -->
  <g transform="translate(370, 390)" filter="url(#shadow4)">
    <rect width="220" height="120" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" rx="8"/>
    <rect width="220" height="30" fill="#4f46e5" rx="8"/>
    <rect y="20" width="220" height="10" fill="#4f46e5"/>
    <text x="110" y="20" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">COMMENTS</text>
    <text x="15" y="50" font-size="11" fill="#0f172a"><tspan fill="#ef4444" font-weight="bold">PK </tspan>id : BIGINT</text>
    <text x="15" y="70" font-size="11" fill="#0f172a"><tspan fill="#3b82f6" font-weight="bold">FK </tspan>user_id : BIGINT</text>
    <text x="15" y="90" font-size="11" fill="#0f172a"><tspan fill="#6366f1" font-weight="bold">FK </tspan>game_id : BIGINT</text>
    <text x="15" y="110" font-size="11" fill="#0f172a">   content : TEXT</text>
  </g>
  <!-- RATINGS -->
  <g transform="translate(370, 540)" filter="url(#shadow4)">
    <rect width="220" height="120" fill="#fefce8" stroke="#eab308" stroke-width="2" rx="8"/>
    <rect width="220" height="30" fill="#eab308" rx="8"/>
    <rect y="20" width="220" height="10" fill="#eab308"/>
    <text x="110" y="20" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">RATINGS</text>
    <text x="15" y="50" font-size="11" fill="#0f172a"><tspan fill="#ef4444" font-weight="bold">PK </tspan>id : BIGINT</text>
    <text x="15" y="70" font-size="11" fill="#0f172a"><tspan fill="#3b82f6" font-weight="bold">FK </tspan>user_id : BIGINT</text>
    <text x="15" y="90" font-size="11" fill="#0f172a"><tspan fill="#6366f1" font-weight="bold">FK </tspan>game_id : BIGINT</text>
    <text x="15" y="110" font-size="11" fill="#0f172a">   score : TINYINT (1-5)</text>
  </g>
  <!-- GAME_CATEGORY -->
  <g transform="translate(700, 420)" filter="url(#shadow4)">
    <rect width="220" height="100" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="8"/>
    <rect width="220" height="30" fill="#16a34a" rx="8"/>
    <rect y="20" width="220" height="10" fill="#16a34a"/>
    <text x="110" y="20" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">GAME_CATEGORY (PIVOT)</text>
    <text x="15" y="55" font-size="11" fill="#0f172a"><tspan fill="#ef4444" font-weight="bold">PK,FK </tspan>game_id : BIGINT</text>
    <text x="15" y="80" font-size="11" fill="#0f172a"><tspan fill="#ef4444" font-weight="bold">PK,FK </tspan>category_id : BIGINT</text>
  </g>
  <!-- CATEGORIES -->
  <g transform="translate(700, 560)" filter="url(#shadow4)">
    <rect width="220" height="120" fill="#ecfdf5" stroke="#10b981" stroke-width="2" rx="8"/>
    <rect width="220" height="30" fill="#10b981" rx="8"/>
    <rect y="20" width="220" height="10" fill="#10b981"/>
    <text x="110" y="20" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">CATEGORIES</text>
    <text x="15" y="55" font-size="11" fill="#0f172a"><tspan fill="#ef4444" font-weight="bold">PK </tspan>id : BIGINT</text>
    <text x="15" y="75" font-size="11" fill="#0f172a">   name : VARCHAR(100)</text>
    <text x="15" y="95" font-size="11" fill="#0f172a">   slug : VARCHAR(100)</text>
    <text x="15" y="115" font-size="11" fill="#0f172a">   icon : VARCHAR(50)</text>
  </g>
  <!-- Lines -->
  <path d="M 260 135 L 370 135" stroke="#ec4899" stroke-width="1.8"/>
  <path d="M 590 135 L 700 135" stroke="#ec4899" stroke-width="1.8"/>
  <path d="M 260 200 L 310 200 L 310 280 L 370 280" stroke="#8b5cf6" stroke-width="1.8"/>
  <path d="M 590 280 L 650 280 L 650 180 L 700 180" stroke="#8b5cf6" stroke-width="1.8"/>
  <path d="M 260 250 L 300 250 L 300 440 L 370 440" stroke="#4f46e5" stroke-width="1.8"/>
  <path d="M 590 440 L 660 440 L 660 240 L 700 240" stroke="#4f46e5" stroke-width="1.8"/>
  <path d="M 260 270 L 290 270 L 290 590 L 370 590" stroke="#eab308" stroke-width="1.8"/>
  <path d="M 590 590 L 670 590 L 670 300 L 700 300" stroke="#eab308" stroke-width="1.8"/>
  <path d="M 810 360 L 810 420" stroke="#16a34a" stroke-width="1.8"/>
  <path d="M 810 520 L 810 560" stroke="#10b981" stroke-width="1.8"/>
</svg>
