<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <text x="450" y="35" font-size="20" font-weight="bold" fill="#1e1b4b" text-anchor="middle">HÌNH 3.2: SƠ ĐỒ USECASE PHÂN HỆ P1 (NÂNG CAO)</text>
  <rect x="230" y="60" width="440" height="410" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6"/>
  <text x="450" y="85" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">PHÂN HỆ TÍNH NĂNG NÂNG CAO (MEMBER INTERACTION)</text>
  <g filter="url(#shadow3)">
    <ellipse cx="450" cy="140" rx="130" ry="22" fill="#fdf4ff" stroke="#d946ef" stroke-width="1.5"/>
    <text x="450" y="144" font-size="12" font-weight="bold" fill="#a21caf" text-anchor="middle">UC07: Yêu thích game (Favorites)</text>
    
    <ellipse cx="450" cy="215" rx="130" ry="22" fill="#fdf4ff" stroke="#d946ef" stroke-width="1.5"/>
    <text x="450" y="219" font-size="12" font-weight="bold" fill="#a21caf" text-anchor="middle">UC08: Ghi lịch sử chơi game</text>
    
    <ellipse cx="450" cy="290" rx="130" ry="22" fill="#fdf4ff" stroke="#d946ef" stroke-width="1.5"/>
    <text x="450" y="294" font-size="12" font-weight="bold" fill="#a21caf" text-anchor="middle">UC09: Bình luận &amp; Đánh giá 1-5 sao</text>
    
    <ellipse cx="450" cy="380" rx="130" ry="22" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="450" y="384" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">UC10: Kiểm duyệt bình luận</text>
  </g>
  
  <!-- Member Actor -->
  <g transform="translate(60, 180)">
    <circle cx="40" cy="20" r="16" fill="#a855f7"/>
    <line x1="40" y1="36" x2="40" y2="80" stroke="#a855f7" stroke-width="3"/>
    <line x1="40" y1="50" x2="10" y2="65" stroke="#a855f7" stroke-width="3"/>
    <line x1="40" y1="50" x2="70" y2="65" stroke="#a855f7" stroke-width="3"/>
    <line x1="40" y1="80" x2="15" y2="120" stroke="#a855f7" stroke-width="3"/>
    <line x1="40" y1="80" x2="65" y2="120" stroke="#a855f7" stroke-width="3"/>
    <text x="40" y="145" font-size="13" font-weight="bold" fill="#581c87" text-anchor="middle">Thành viên</text>
  </g>

  <!-- Admin Actor -->
  <g transform="translate(760, 180)">
    <circle cx="40" cy="20" r="16" fill="#ef4444"/>
    <line x1="40" y1="36" x2="40" y2="80" stroke="#ef4444" stroke-width="3"/>
    <line x1="40" y1="50" x2="10" y2="65" stroke="#ef4444" stroke-width="3"/>
    <line x1="40" y1="50" x2="70" y2="65" stroke="#ef4444" stroke-width="3"/>
    <line x1="40" y1="80" x2="15" y2="120" stroke="#ef4444" stroke-width="3"/>
    <line x1="40" y1="80" x2="65" y2="120" stroke="#ef4444" stroke-width="3"/>
    <text x="40" y="145" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">Admin CMS</text>
  </g>

  <line x1="120" y1="230" x2="320" y2="140" stroke="#d946ef" stroke-width="1.5"/>
  <line x1="120" y1="230" x2="320" y2="215" stroke="#d946ef" stroke-width="1.5"/>
  <line x1="120" y1="230" x2="320" y2="290" stroke="#d946ef" stroke-width="1.5"/>
  
  <line x1="760" y1="230" x2="580" y2="380" stroke="#ef4444" stroke-width="1.5"/>
</svg>
