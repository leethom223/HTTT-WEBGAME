<svg width="800" height="460" viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <text x="400" y="38" font-size="22" font-weight="bold" fill="#1e1b4b" text-anchor="middle">HÌNH 2.2: LUỒNG XỬ LÝ MVC &amp; API TRONG LARAVEL</text>
  <!-- Client -->
  <g transform="translate(40, 180)" filter="url(#shadow2)">
    <rect width="130" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="65" y="45" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">CLIENT</text>
    <text x="65" y="70" font-size="12" fill="#475569" text-anchor="middle">(React.js SPA)</text>
  </g>
  <!-- Router -->
  <g transform="translate(230, 180)" filter="url(#shadow2)">
    <rect width="140" height="100" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="70" y="40" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">ROUTER &amp;</text>
    <text x="70" y="60" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">MIDDLEWARE</text>
    <text x="70" y="82" font-size="11" fill="#7f1d1d" text-anchor="middle">Sanctum / CORS</text>
  </g>
  <!-- Controller -->
  <g transform="translate(430, 180)" filter="url(#shadow2)">
    <rect width="140" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="70" y="45" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">CONTROLLER</text>
    <text x="70" y="72" font-size="12" fill="#78350f" text-anchor="middle">Xử lý nghiệp vụ</text>
  </g>
  <!-- Model -->
  <g transform="translate(430, 60)" filter="url(#shadow2)">
    <rect width="140" height="80" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="70" y="38" font-size="15" font-weight="bold" fill="#166534" text-anchor="middle">MODEL</text>
    <text x="70" y="60" font-size="12" fill="#14532d" text-anchor="middle">Eloquent ORM</text>
  </g>
  <!-- Database -->
  <g transform="translate(630, 60)" filter="url(#shadow2)">
    <rect width="130" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="65" y="38" font-size="15" font-weight="bold" fill="#075985" text-anchor="middle">DATABASE</text>
    <text x="65" y="60" font-size="12" fill="#0369a1" text-anchor="middle">MySQL Storage</text>
  </g>
  <!-- View Response -->
  <g transform="translate(430, 330)" filter="url(#shadow2)">
    <rect width="140" height="80" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="70" y="38" font-size="15" font-weight="bold" fill="#5b21b6" text-anchor="middle">RESPONSE</text>
    <text x="70" y="60" font-size="12" fill="#4c1d95" text-anchor="middle">JSON Data View</text>
  </g>
  <path d="M 175 220 L 225 220" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M 375 220 L 425 220" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M 500 175 L 500 145" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M 575 100 L 625 100" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M 625 115 L 575 115" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M 500 285 L 500 325" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M 425 370 L 105 370 L 105 285" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="250" y="360" font-size="12" font-weight="bold" fill="#5b21b6">Trả dữ liệu JSON về cho React Client</text>
</svg>
