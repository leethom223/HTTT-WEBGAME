<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <text x="450" y="35" font-size="20" font-weight="bold" fill="#1e1b4b" text-anchor="middle">HÌNH 3.1: SƠ ĐỒ USECASE PHÂN HỆ P0 (CỐT LÕI)</text>
  <rect x="230" y="60" width="440" height="510" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6"/>
  <text x="450" y="85" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">PHÂN HỆ CHỨC NĂNG CỐT LÕI</text>
  <g filter="url(#shadow3)">
    <ellipse cx="450" cy="130" rx="130" ry="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="450" y="134" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">UC01: Duyệt danh sách game</text>
    
    <ellipse cx="450" cy="195" rx="130" ry="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="450" y="199" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">UC02: Tìm kiếm game</text>
    
    <ellipse cx="450" cy="260" rx="130" ry="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="450" y="264" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">UC03: Chơi game (GamePlayer)</text>
    
    <ellipse cx="450" cy="325" rx="130" ry="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="450" y="329" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">UC04: Xác thực (Auth Sanctum)</text>
    
    <ellipse cx="450" cy="410" rx="130" ry="22" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="450" y="414" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">UC05: Quản trị danh mục</text>
    
    <ellipse cx="450" cy="475" rx="130" ry="22" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="450" y="479" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">UC06: Quản trị trò chơi (CRUD)</text>
  </g>
  
  <!-- Guest Actor -->
  <g transform="translate(60, 100)">
    <circle cx="40" cy="20" r="16" fill="#3b82f6"/>
    <line x1="40" y1="36" x2="40" y2="80" stroke="#3b82f6" stroke-width="3"/>
    <line x1="40" y1="50" x2="10" y2="65" stroke="#3b82f6" stroke-width="3"/>
    <line x1="40" y1="50" x2="70" y2="65" stroke="#3b82f6" stroke-width="3"/>
    <line x1="40" y1="80" x2="15" y2="120" stroke="#3b82f6" stroke-width="3"/>
    <line x1="40" y1="80" x2="65" y2="120" stroke="#3b82f6" stroke-width="3"/>
    <text x="40" y="145" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Khách (Guest)</text>
  </g>

  <!-- Member Actor -->
  <g transform="translate(60, 310)">
    <circle cx="40" cy="20" r="16" fill="#a855f7"/>
    <line x1="40" y1="36" x2="40" y2="80" stroke="#a855f7" stroke-width="3"/>
    <line x1="40" y1="50" x2="10" y2="65" stroke="#a855f7" stroke-width="3"/>
    <line x1="40" y1="50" x2="70" y2="65" stroke="#a855f7" stroke-width="3"/>
    <line x1="40" y1="80" x2="15" y2="120" stroke="#a855f7" stroke-width="3"/>
    <line x1="40" y1="80" x2="65" y2="120" stroke="#a855f7" stroke-width="3"/>
    <text x="40" y="145" font-size="13" font-weight="bold" fill="#581c87" text-anchor="middle">Thành viên</text>
  </g>

  <path d="M 100 310 L 100 240" stroke="#64748b" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="100,230 94,242 106,242" fill="#64748b"/>

  <!-- Admin Actor -->
  <g transform="translate(760, 240)">
    <circle cx="40" cy="20" r="16" fill="#ef4444"/>
    <line x1="40" y1="36" x2="40" y2="80" stroke="#ef4444" stroke-width="3"/>
    <line x1="40" y1="50" x2="10" y2="65" stroke="#ef4444" stroke-width="3"/>
    <line x1="40" y1="50" x2="70" y2="65" stroke="#ef4444" stroke-width="3"/>
    <line x1="40" y1="80" x2="15" y2="120" stroke="#ef4444" stroke-width="3"/>
    <line x1="40" y1="80" x2="65" y2="120" stroke="#ef4444" stroke-width="3"/>
    <text x="40" y="145" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">Admin CMS</text>
  </g>

  <line x1="120" y1="150" x2="320" y2="130" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="120" y1="150" x2="320" y2="195" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="120" y1="150" x2="320" y2="260" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="120" y1="150" x2="320" y2="325" stroke="#0284c7" stroke-width="1.5"/>
  
  <line x1="760" y1="290" x2="580" y2="410" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="760" y1="290" x2="580" y2="475" stroke="#ef4444" stroke-width="1.5"/>
</svg>
