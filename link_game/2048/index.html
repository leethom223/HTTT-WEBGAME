<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048 Classic Puzzle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f111a;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    .game-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 2.5rem;
      font-weight: 900;
      color: #e2e8f0;
      letter-spacing: 1px;
    }
    .scores {
      display: flex;
      gap: 8px;
    }
    .score-box {
      background: #1e2233;
      padding: 6px 14px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #334155;
    }
    .score-label {
      font-size: 0.65rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: bold;
    }
    .score-val {
      font-size: 1.2rem;
      font-weight: bold;
      color: #38bdf8;
    }
    .grid-container {
      width: 100%;
      height: 400px;
      background: #181b26;
      border-radius: 12px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
      border: 2px solid #334155;
      position: relative;
    }
    .cell {
      background: #232738;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: bold;
      color: #f8fafc;
      transition: all 0.12s ease-in-out;
    }
    .cell[data-val="2"] { background: #334155; color: #f8fafc; }
    .cell[data-val="4"] { background: #475569; color: #f8fafc; }
    .cell[data-val="8"] { background: #f97316; color: #fff; box-shadow: 0 0 10px rgba(249,115,22,0.4); }
    .cell[data-val="16"] { background: #ea580c; color: #fff; box-shadow: 0 0 12px rgba(234,88,12,0.5); }
    .cell[data-val="32"] { background: #ef4444; color: #fff; box-shadow: 0 0 14px rgba(239,68,68,0.5); }
    .cell[data-val="64"] { background: #dc2626; color: #fff; box-shadow: 0 0 16px rgba(220,38,38,0.6); }
    .cell[data-val="128"] { background: #eab308; color: #fff; font-size: 1.4rem; box-shadow: 0 0 18px rgba(234,179,8,0.6); }
    .cell[data-val="256"] { background: #ca8a04; color: #fff; font-size: 1.4rem; box-shadow: 0 0 20px rgba(202,138,4,0.7); }
    .cell[data-val="512"] { background: #84cc16; color: #fff; font-size: 1.4rem; box-shadow: 0 0 22px rgba(132,204,22,0.7); }
    .cell[data-val="1024"] { background: #06b6d4; color: #fff; font-size: 1.2rem; box-shadow: 0 0 25px rgba(6,182,212,0.8); }
    .cell[data-val="2048"] { background: #a855f7; color: #fff; font-size: 1.2rem; box-shadow: 0 0 30px rgba(168,85,247,0.9); }
    
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-restart {
      padding: 10px 18px;
      background: #6366f1;
      border: none;
      color: #fff;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-restart:hover { background: #4f46e5; }
    .instructions {
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="header">
      <div class="title">2048</div>
      <div class="scores">
        <div class="score-box">
          <div class="score-label">ĐIỂM SỐ</div>
          <div class="score-val" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="score-label">KỶ LỤC</div>
          <div class="score-val" id="best">0</div>
        </div>
      </div>
    </div>

    <div class="grid-container" id="grid"></div>

    <div class="footer-bar">
      <div class="instructions">Dùng phím <b>W, A, S, D</b> hoặc <b>← ↑ → ↓</b></div>
      <button class="btn-restart" id="btnRestart">Chơi lại 🔄</button>
    </div>
  </div>

  <script>
    let board = Array(4).fill(null).map(() => Array(4).fill(0));
    let score = 0;
    let best = localStorage.getItem('2048_best') || 0;
    document.getElementById('best').innerText = best;

    function init() {
      board = Array(4).fill(null).map(() => Array(4).fill(0));
      score = 0;
      updateScore(0);
      addRandomTile();
      addRandomTile();
      render();
    }

    function addRandomTile() {
      const empty = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (board[r][c] === 0) empty.push({ r, c });
        }
      }
      if (empty.length > 0) {
        const rand = empty[Math.floor(Math.random() * empty.length)];
        board[rand.r][rand.c] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const val = board[r][c];
          const cell = document.createElement('div');
          cell.className = 'cell';
          if (val > 0) {
            cell.innerText = val;
            cell.setAttribute('data-val', val);
          }
          grid.appendChild(cell);
        }
      }
    }

    function updateScore(add) {
      score += add;
      document.getElementById('score').innerText = score;
      if (score > best) {
        best = score;
        localStorage.setItem('2048_best', best);
        document.getElementById('best').innerText = best;
      }
    }

    function slide(row) {
      let arr = row.filter(val => val);
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2;
          updateScore(arr[i]);
          arr[i + 1] = 0;
        }
      }
      arr = arr.filter(val => val);
      while (arr.length < 4) arr.push(0);
      return arr;
    }

    function moveLeft() {
      let changed = false;
      for (let r = 0; r < 4; r++) {
        const oldRow = [...board[r]];
        board[r] = slide(board[r]);
        if (oldRow.join(',') !== board[r].join(',')) changed = true;
      }
      if (changed) { addRandomTile(); render(); }
    }

    function moveRight() {
      let changed = false;
      for (let r = 0; r < 4; r++) {
        const oldRow = [...board[r]];
        board[r] = slide(board[r].reverse()).reverse();
        if (oldRow.join(',') !== board[r].join(',')) changed = true;
      }
      if (changed) { addRandomTile(); render(); }
    }

    function moveUp() {
      let changed = false;
      for (let c = 0; c < 4; c++) {
        const col = [board[0][c], board[1][c], board[2][c], board[3][c]];
        const newCol = slide(col);
        for (let r = 0; r < 4; r++) {
          if (board[r][c] !== newCol[r]) changed = true;
          board[r][c] = newCol[r];
        }
      }
      if (changed) { addRandomTile(); render(); }
    }

    function moveDown() {
      let changed = false;
      for (let c = 0; c < 4; c++) {
        const col = [board[3][c], board[2][c], board[1][c], board[0][c]];
        const newCol = slide(col);
        for (let r = 0; r < 4; r++) {
          if (board[3 - r][c] !== newCol[r]) changed = true;
          board[3 - r][c] = newCol[r];
        }
      }
      if (changed) { addRandomTile(); render(); }
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); moveLeft(); }
      else if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); moveRight(); }
      else if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); moveUp(); }
      else if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); moveDown(); }
    });

    // Touch support for mobile
    let touchStartX = 0, touchStartY = 0;
    document.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, false);
    document.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30) moveRight();
        else if (dx < -30) moveLeft();
      } else {
        if (dy > 30) moveDown();
        else if (dy < -30) moveUp();
      }
    }, false);

    document.getElementById('btnRestart').onclick = init;
    init();
  </script>
</body>
</html>
