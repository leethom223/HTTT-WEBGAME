<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake Retro 1997</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f111a;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .game-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .header-stats {
      display: flex;
      justify-content: space-between;
      width: 400px;
      padding: 8px 16px;
      background: #181b26;
      border: 1px solid #334155;
      border-radius: 8px;
    }
    .stat-text {
      font-size: 0.95rem;
      font-weight: bold;
      color: #38bdf8;
    }
    #snakeCanvas {
      background: #10141f;
      border: 2px solid #22c55e;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
    }
    .guide-box {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="header-stats">
      <span class="stat-text" id="scoreTxt">Điểm: 0</span>
      <span class="stat-text" id="bestTxt" style="color:#fbbf24">Kỷ lục: 0</span>
    </div>
    <canvas id="snakeCanvas" width="400" height="400"></canvas>
    <div class="guide-box">Sử dụng phím <b>W, A, S, D</b> hoặc <b>← ↑ → ↓</b> để đổi hướng rắn</div>
  </div>

  <script>
    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');
    const grid = 20;
    const count = 20;

    let snake = [{ x: 10, y: 10 }, { x: 10, y: 11 }, { x: 10, y: 12 }];
    let dx = 0, dy = -1;
    let apple = { x: 5, y: 5 };
    let score = 0;
    let best = localStorage.getItem('snake_best') || 0;
    let gameOver = false;
    document.getElementById('bestTxt').innerText = `Kỷ lục: ${best}`;

    function spawnApple() {
      apple = {
        x: Math.floor(Math.random() * count),
        y: Math.floor(Math.random() * count)
      };
    }

    function reset() {
      snake = [{ x: 10, y: 10 }, { x: 10, y: 11 }, { x: 10, y: 12 }];
      dx = 0; dy = -1;
      score = 0;
      gameOver = false;
      document.getElementById('scoreTxt').innerText = `Điểm: ${score}`;
      spawnApple();
    }

    function gameLoop() {
      if (!gameOver) {
        // Move snake head
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        // Wall collision wrap-around
        if (head.x < 0) head.x = count - 1;
        if (head.x >= count) head.x = 0;
        if (head.y < 0) head.y = count - 1;
        if (head.y >= count) head.y = 0;

        // Self collision
        for (let i = 0; i < snake.length; i++) {
          if (head.x === snake[i].x && head.y === snake[i].y && (dx !== 0 || dy !== 0)) {
            gameOver = true;
          }
        }

        snake.unshift(head);

        // Eat Apple
        if (head.x === apple.x && head.y === apple.y) {
          score += 10;
          document.getElementById('scoreTxt').innerText = `Điểm: ${score}`;
          if (score > best) {
            best = score;
            localStorage.setItem('snake_best', best);
            document.getElementById('bestTxt').innerText = `Kỷ lục: ${best}`;
          }
          spawnApple();
        } else {
          snake.pop();
        }
      }

      // Draw
      ctx.fillStyle = '#10141f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Apple
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(apple.x * grid + grid / 2, apple.y * grid + grid / 2, grid / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Draw Snake
      snake.forEach((s, idx) => {
        ctx.fillStyle = idx === 0 ? '#4ade80' : '#22c55e';
        ctx.fillRect(s.x * grid + 1, s.y * grid + 1, grid - 2, grid - 2);
      });

      // Game Over Screen
      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 24px "Segoe UI", Arial';
        ctx.textAlign = 'center';
        ctx.fillText('RẮN ĐÃ ĐÂM ĐUÔI!', canvas.width / 2, 180);
        ctx.fillStyle = '#fff';
        ctx.font = '16px "Segoe UI", Arial';
        ctx.fillText(`Điểm đạt được: ${score}`, canvas.width / 2, 220);
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('Nhấn phím bất kỳ để chơi lại', canvas.width / 2, 260);
      }
    }

    window.addEventListener('keydown', e => {
      if (gameOver) { reset(); return; }
      if (['ArrowLeft', 'KeyA'].includes(e.code) && dx !== 1) { dx = -1; dy = 0; }
      else if (['ArrowRight', 'KeyD'].includes(e.code) && dx !== -1) { dx = 1; dy = 0; }
      else if (['ArrowUp', 'KeyW'].includes(e.code) && dy !== 1) { dx = 0; dy = -1; }
      else if (['ArrowDown', 'KeyS'].includes(e.code) && dy !== -1) { dx = 0; dy = 1; }
    });

    setInterval(gameLoop, 90);
  </script>
</body>
</html>
