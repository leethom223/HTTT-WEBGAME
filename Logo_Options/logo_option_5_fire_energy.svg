<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a"/>
      <stop offset="50%" stop-color="#ff4b1f"/>
      <stop offset="100%" stop-color="#ff9068"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="130" rx="16" fill="#140700" stroke="#ff4b1f" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Icon: Blazing Fire & Lightning Bolt Controller -->
  <g transform="translate(25, 18)">
    <!-- Fire Shape -->
    <path d="M45,5 C55,20 68,30 68,48 C68,66 54,85 45,92 C36,85 22,66 22,48 C22,32 35,22 45,5 Z" fill="url(#fireGrad)"/>
    
    <!-- Lightning Cutout -->
    <polygon points="48,22 36,46 44,46 40,70 54,44 46,44" fill="#ffffff"/>
    
    <!-- Big 36 Badge Overlaid -->
    <text x="45" y="86" fill="#ffffff" font-family="'Impact', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">36</text>
  </g>

  <!-- Typography -->
  <g transform="translate(130, 25)">
    <text x="0" y="52" font-family="'Impact', 'Arial Black', sans-serif" font-size="48" font-weight="900" letter-spacing="2">
      <tspan fill="url(#fireGrad)">36</tspan>
      <tspan fill="#ffffff">GAME</tspan>
      <tspan fill="#ff4b1f">S</tspan>
    </text>

    <!-- Fire subtitle -->
    <text x="2" y="78" fill="#ff9068" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="3.5">
      🔥 CHƠI GAME KHÔNG GIỚI HẠN 🔥
    </text>
  </g>
</svg>
