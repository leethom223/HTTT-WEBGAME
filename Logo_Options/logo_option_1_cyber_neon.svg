<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background container preview -->
  <rect width="500" height="130" rx="16" fill="url(#bgGrad)" stroke="#312e81" stroke-width="1.5"/>

  <!-- Logo Icon: Futuristic Gamepad Shield with 36 Emblem -->
  <g transform="translate(25, 20)">
    <!-- Hexagon Outer Shield -->
    <polygon points="45,5 82,26 82,69 45,90 8,69 8,26" fill="#18182f" stroke="url(#cyberGrad)" stroke-width="3" filter="url(#neonGlow)"/>
    
    <!-- Gamepad Body -->
    <path d="M24,42 C24,36 29,32 36,32 L54,32 C61,32 66,36 66,42 L67,58 C67,66 61,70 54,66 L49,63 L41,63 L36,66 C29,70 23,66 23,58 Z" fill="#090a16" stroke="#00f2fe" stroke-width="2"/>
    
    <!-- D-Pad Left -->
    <path d="M30,44 L34,44 L34,40 L36,40 L36,44 L40,44 L40,46 L36,46 L36,50 L34,50 L34,46 L30,46 Z" fill="#ec4899"/>
    
    <!-- Action Buttons Right (ABXY) -->
    <circle cx="56" cy="42" r="2" fill="#00f2fe"/>
    <circle cx="60" cy="46" r="2" fill="#38bdf8"/>
    <circle cx="52" cy="46" r="2" fill="#f43f5e"/>
    <circle cx="56" cy="50" r="2" fill="#a855f7"/>

    <!-- Small 36 Central Badge -->
    <text x="45" y="78" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">36</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(130, 25)">
    <!-- Main Title "36GameS" -->
    <text x="0" y="52" font-family="'Montserrat', 'Arial Black', 'Segoe UI', sans-serif" font-size="44" font-weight="900" letter-spacing="1.5">
      <tspan fill="#00f2fe">36</tspan>
      <tspan fill="#ffffff">Game</tspan>
      <tspan fill="#ec4899">S</tspan>
    </text>

    <!-- Glowing dot accent -->
    <circle cx="218" cy="20" r="4" fill="#00f2fe" filter="url(#neonGlow)"/>

    <!-- Slogan / Subtitle -->
    <text x="2" y="75" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="4">
      CỔNG GAME TRỰC TUYẾN 2026
    </text>
  </g>
</svg>
