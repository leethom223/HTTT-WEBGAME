<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="130" rx="16" fill="url(#darkBg)" stroke="#eab308" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Icon: Golden Crown Gamepad Shield -->
  <g transform="translate(25, 18)">
    <!-- Outer Octagon/Shield -->
    <path d="M45,4 L82,20 L82,68 L45,92 L8,68 L8,20 Z" fill="#1f2937" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- Crown Triangles -->
    <path d="M30,22 L37,30 L45,20 L53,30 L60,22 L58,35 L32,35 Z" fill="url(#goldGrad)"/>

    <!-- Game Controller Silhouette -->
    <path d="M26,45 C26,40 32,38 38,38 L52,38 C58,38 64,40 64,45 L65,60 C65,66 60,68 55,65 L49,61 L41,61 L35,65 C30,68 25,66 25,60 Z" fill="#111827" stroke="url(#goldGrad)" stroke-width="2"/>
    
    <!-- Gold Number 36 -->
    <text x="45" y="55" fill="url(#goldGrad)" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" text-anchor="middle">36</text>
    
    <!-- Accent Stars -->
    <polygon points="45,74 47,79 52,79 48,82 50,87 45,84 40,87 42,82 38,79 43,79" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(130, 25)">
    <!-- Main Brand -->
    <text x="0" y="52" font-family="'Trebuchet MS', 'Arial Black', sans-serif" font-size="44" font-weight="900" letter-spacing="2">
      <tspan fill="url(#goldGrad)">36</tspan>
      <tspan fill="#ffffff">Game</tspan>
      <tspan fill="url(#goldGrad)">S</tspan>
    </text>

    <!-- Gold underline streak -->
    <rect x="0" y="60" width="220" height="3" rx="1.5" fill="url(#goldGrad)"/>

    <!-- Subtitle -->
    <text x="2" y="78" fill="#fbbf24" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="4.5">
      PREMIUM GAMING PORTAL
    </text>
  </g>
</svg>
