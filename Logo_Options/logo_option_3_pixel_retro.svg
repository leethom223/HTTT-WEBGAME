<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <linearGradient id="retroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180026"/>
      <stop offset="100%" stop-color="#0a0012"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="130" rx="16" fill="url(#retroBg)" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Icon: 8-Bit Pixel Heart & Arcade Joystick -->
  <g transform="translate(25, 25)">
    <!-- Pixel Gamepad Base -->
    <rect x="10" y="25" width="70" height="40" fill="#4c1d95" stroke="#a78bfa" stroke-width="3"/>
    <rect x="5" y="35" width="80" height="20" fill="#4c1d95"/>
    
    <!-- Pixel D-Pad Red -->
    <rect x="18" y="38" width="6" height="14" fill="#ef4444"/>
    <rect x="14" y="42" width="14" height="6" fill="#ef4444"/>
    
    <!-- Pixel Buttons Green & Yellow -->
    <rect x="56" y="38" width="6" height="6" fill="#22c55e"/>
    <rect x="66" y="44" width="6" height="6" fill="#eab308"/>
    
    <!-- Pixel Badge 36 -->
    <rect x="36" y="10" width="18" height="12" fill="#ec4899"/>
    <text x="45" y="20" fill="#ffffff" font-family="'Courier New', monospace" font-size="10" font-weight="900" text-anchor="middle">36</text>
  </g>

  <!-- Typography Pixel Style -->
  <g transform="translate(130, 25)">
    <text x="0" y="52" font-family="'Impact', 'Arial Black', sans-serif" font-size="46" font-weight="900" letter-spacing="3">
      <tspan fill="#f43f5e">36</tspan>
      <tspan fill="#38bdf8">GAME</tspan>
      <tspan fill="#f59e0b">S</tspan>
    </text>

    <!-- Retro Pixel Details -->
    <rect x="0" y="62" width="230" height="4" fill="#8b5cf6"/>
    <rect x="235" y="62" width="6" height="4" fill="#ec4899"/>

    <text x="2" y="78" fill="#c084fc" font-family="'Courier New', monospace" font-size="12" font-weight="bold" letter-spacing="3">
      ★ RETRO ARCADE CLASSICS ★
    </text>
  </g>
</svg>
